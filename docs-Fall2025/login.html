<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" type="text/css" href="interfaceSettings.css">
  <title>Grizzly Path Login</title>
</head>
<body class="bg-light">
  <div class="container d-flex justify-content-center align-items-center vh-100">
    <div class="card p-4 shadow" style="width: 350px;">
      <h3 class="text-center mb-3">Grizzly Path Login</h3>

      <form id="loginForm">
        <div class="mb-3">
          <label for="studentname" class="form-label">Student Name</label>
          <input type="text" class="form-control" id="studentname" required>
        </div>
        <div class="mb-3">
          <label for="studentID" class="form-label">Student ID</label>
          <input type="number" class="form-control" id="studentID" required>
        </div>
        <div class="d-grid">
          <button type="submit" class="btn btn-primary">Login</button>
        </div>
      </form>
      <div id="message" class="mt-3 text-center text-danger"></div>
    </div>
  </div>

  <script>
    const form = document.getElementById('loginForm');
    const message = document.getElementById('message');

    form.addEventListener('submit', function(e) {
      e.preventDefault(); 

      const studentName = document.getElementById('studentname').value;
      const studentID = document.getElementById('studentID').value;

      // Demo login check
      if(studentName && studentID) { // just check if both fields are filled
        // Save student info to localStorage
        localStorage.setItem('studentName', studentName);
        localStorage.setItem('studentID', studentID);

        // Redirect to dashboard HTML
        window.location.href = "GrizzlyPathsInterface.html";
      } else {
        message.textContent = "Please enter both name and ID!";
      }
    });
  </script>
</body>
</html>
