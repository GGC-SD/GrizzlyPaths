<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <title>Grizzly Path Dashboard</title>
</head>
<body class="bg-light">

  <!-- Navbar with Logout button -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
      <div class="container-fluid">
        <a class="navbar-brand" href="#">Grizzly Path</a>
        <div class="d-flex">
          <button id="logoutBtn" class="btn btn-danger">Logout</button>
        </div>
      </div>
    </nav>

  <div class="container mt-5">
    <h1 class="text-center">Welcome to Grizzly Path</h1>
    <h2 class="mb-3">My Dashboard</h2>
    <div class="row mt-4">

      <!-- Profile Card -->
      <div class="col-md-4">
        <div class="card shadow-sm">
          <div class="card-body text-center">
            <h5 class="card-title">Profile</h5>
            <p class="card-text" id="profileInfo">Student Name: _____<br>Student ID: _____</p>
            <a href="#" class="btn btn-outline-primary btn-sm">Edit Profile</a>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
      // Get student info from localStorage
      const studentName = localStorage.getItem('studentName') || "Guest";
      const studentID = localStorage.getItem('studentID') || "N/A";

      // Fill the Profile Card
      document.getElementById('profileInfo').innerHTML = 
      `Student Name: ${studentName}<br>Student ID: ${studentID}`;

      // Logout button
      document.getElementById('logoutBtn').addEventListener('click', () => {
      localStorage.clear();
      window.location.href = "login.html";
    });
  </script>
</body>
</html>
